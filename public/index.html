<!DOCTYPE html>
<html>
<head>
  <title>Hartford GAA Fixtures</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="header">
    <img src="crest.png" class="crest" />
    <h1>Hartford GAA Fixtures</h1>
  </div>

  <div class="controls">
    <select id="filter">
      <option value="ALL">All</option>
      <option value="MJCFC">MJCFC</option>
      <option value="MJCHC">MJCHC</option>
      <option value="LJFC">LJFC</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Match</th>
        <th>Field</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="games"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
